spring.application.name=minga
server.port=8080

# ------------------------------------------------------------------
# Variables de entorno: se leen del archivo .env (que NO se sube a GitHub)
# o del sistema operativo. Ver .env.example
# ------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# ------------------------------------------------------------------
# Base de datos MySQL (Aiven, local, etc.): todo sale de .env
# ------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:minga_db}?sslMode=${DB_SSL_MODE:PREFERRED}&createDatabaseIfNotExist=${DB_CREATE_IF_MISSING:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Crea/actualiza las tablas y conserva los datos al reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ------------------------------------------------------------------
# Reglas de Minga
# ------------------------------------------------------------------
app.minga.horas-bienvenida=3
app.minga.dias-expiracion=7
# Carga usuarios y servicios de ejemplo la primera vez (ponlo en false para produccion)
app.demo-data=${DEMO_DATA:true}

# ------------------------------------------------------------------
# Seguridad (login)
# ------------------------------------------------------------------
app.seguridad.max-intentos=3
app.seguridad.bloqueo-minutos=5
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
