<!DOCTYPE html>
<html lang="es">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231f2a5c%27/%3E%3Ccircle cx=%2713%27 cy=%2713%27 r=%277%27 fill=%27%23f4b73f%27/%3E%3Ccircle cx=%2721%27 cy=%2716%27 r=%277%27 fill=%27%232f7d5b%27 fill-opacity=%27.9%27/%3E%3Ccircle cx=%2715%27 cy=%2722%27 r=%276%27 fill=%27%23c8553d%27 fill-opacity=%27.9%27/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="minga.css">
    <title>Panel · Minga</title>
</head>
<body>
<header id="cabecera"></header>
<div id="avisos" aria-live="polite"></div>

<main class="contenedor">
    <div class="encabezado">
        <div>
            <h1>Panel de la Minga</h1>
            <p class="bajada">Lo que hemos logrado entre todos: horas que circulan en lugar de dinero.</p>
        </div>
    </div>

    <div class="cifras">
        <div class="cifra-tarjeta"><strong id="cMiembros">0</strong><span>vecinos en la Minga</span></div>
        <div class="cifra-tarjeta"><strong id="cServicios">0</strong><span>publicaciones activas</span></div>
        <div class="cifra-tarjeta"><strong id="cRealizados">0</strong><span>intercambios realizados</span></div>
        <div class="cifra-tarjeta"><strong id="cHoras">0</strong><span>horas intercambiadas</span></div>
    </div>

    <div class="dos-columnas" style="grid-template-columns:1fr 1fr">
        <section class="tarjeta">
            <h2>Categorías más pedidas</h2>
            <div class="barras" id="barCategorias"></div>
        </section>
        <section class="tarjeta">
            <h2>Vecinos por barrio</h2>
            <div class="barras" id="barBarrios"></div>
        </section>
    </div>

    <section class="tarjeta" id="admin" style="margin-top:1.5rem" hidden>
        <h2>Administración: nueva categoría</h2>
        <form id="formCategoria" class="campos-fila" style="align-items:end" novalidate>
            <div class="campo">
                <label for="catNombre">Nombre</label>
                <input type="text" id="catNombre" maxlength="40">
            </div>
            <div class="campo">
                <label for="catDescripcion">Descripción (opcional)</label>
                <input type="text" id="catDescripcion" maxlength="120">
            </div>
            <button type="submit" class="indigo" style="grid-column:1/-1;justify-self:start">Crear categoría</button>
        </form>
    </section>
</main>

<script src="minga.js"></script>
<script src="panel.js"></script>
</body>
</html>
