# Perfil "h2": ejecuta Minga SIN MySQL (los datos quedan en la carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/minga;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
